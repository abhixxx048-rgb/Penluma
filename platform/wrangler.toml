# Cloudflare Pages configuration.

name = "penluma"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# KV namespace - powers per-post view counts, likes, newsletter signups, and
# the contact form's backup copy. Created with `wrangler kv namespace create`.
# The id below is a resource identifier, not a secret.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "BLOG_KV"
id = "b782176e4f7b403f8a1b047251912ecb"
